[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiper-net"
version = "0.1.0"
description = "WIPER: weighted in-path edge ranking for biomolecular association networks"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Jake Y. Chen", email = "jakechen@uab.edu"},
    {name = "Zongliang Yue"},
    {name = "Thanh Nguyen"},
    {name = "Eric Zhang"},
    {name = "Jianyi Zhang"},
]
maintainers = [
    {name = "Jake Y. Chen", email = "jakechen@uab.edu"},
]
license = {text = "MIT for WIPER1 portions; WIPER2 non-commercial research and education use; see LICENSE and LICENSE-WIPER2-NONCOMMERCIAL.md"}
keywords = ["network biology", "edge ranking", "WIPER", "bioinformatics", "PPI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: Other/Proprietary License",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
    "joblib>=1.2",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
dev = ["pytest>=7", "pytest-cov", "build", "torch>=2.0"]
all = ["torch>=2.0"]

[project.scripts]
wiper = "wiper.cli:main"
wiper-web = "wiper.webapp:main"

[project.urls]
"Paper" = "https://doi.org/10.1007/s40484-019-0180-y"
"WINNER reference layout" = "https://github.com/aimed-lab/WINNER"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wiper = ["py.typed", "web/*"]
