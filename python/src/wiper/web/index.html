<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WIPER Edge Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>WIPER Edge Explorer</h1>
        <span id="summary">Ready</span>
      </div>
      <div class="toolbar">
        <button id="sampleBtn" type="button">Sample</button>
        <button id="randomBtn" type="button">Random</button>
        <button id="analyzeBtn" type="button" class="primary">Analyze</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel controls">
        <label class="filePick">
          <span>Network file</span>
          <input id="fileInput" type="file" accept=".tsv,.txt,.csv" />
        </label>
        <label>
          <span>Edge list</span>
          <textarea id="edgeText" spellcheck="false"></textarea>
        </label>
        <div class="grid2">
          <label>
            <span>Iterations</span>
            <input id="iterationsInput" type="number" min="0" max="500" value="80" />
          </label>
          <label>
            <span>Device</span>
            <select id="deviceInput">
              <option value="cpu">CPU</option>
              <option value="auto">Auto</option>
              <option value="cuda">CUDA</option>
              <option value="mps">MPS</option>
            </select>
          </label>
        </div>
        <label class="check">
          <input id="includeNovelInput" type="checkbox" />
          <span>WIPER1 novel edges</span>
        </label>

        <section class="controlBlock">
          <span class="blockLabel">Edge score</span>
          <div class="segments" id="metricSegments">
            <button type="button" data-metric="raw" class="active">Raw</button>
            <button type="button" data-metric="wiper1">WIPER1</button>
            <button type="button" data-metric="wiper2">WIPER2</button>
          </div>
          <div class="segments mini" id="edgeMeasureSegments">
            <button type="button" data-measure="ufc" class="active">UFC</button>
            <button type="button" data-measure="weight">W</button>
          </div>
          <div class="segments mini" id="edgeScaleSegments">
            <button type="button" data-scale="normal" class="active">Normal</button>
            <button type="button" data-scale="log">Log</button>
          </div>
        </section>

        <section class="controlBlock">
          <span class="blockLabel">Network generator</span>
          <div class="segments" id="generatorModelSegments">
            <button type="button" data-generator="random" class="active">Random</button>
            <button type="button" data-generator="scale-free">Scale-free</button>
          </div>
          <div class="grid2">
            <label>
              <span>Nodes</span>
              <input id="generatorNodeCountInput" type="number" min="3" max="80" value="12" />
            </label>
            <label>
              <span>Edges</span>
              <input id="generatorEdgeCountInput" type="number" min="2" max="400" value="18" />
            </label>
          </div>
          <div class="grid2">
            <label>
              <span>Min weight</span>
              <input id="generatorMinWeightInput" type="number" min="0" max="1" step="0.05" value="0.10" />
            </label>
            <label>
              <span>Max weight</span>
              <input id="generatorMaxWeightInput" type="number" min="0" max="1" step="0.05" value="0.95" />
            </label>
          </div>
        </section>

        <section class="controlBlock">
          <span class="blockLabel">Edge filter</span>
          <div class="segments" id="edgeFilterSegments">
            <button type="button" data-mode="all" class="active">All</button>
            <button type="button" data-mode="topn">Top N</button>
            <button type="button" data-mode="percent">Top %</button>
            <button type="button" data-mode="threshold">Score</button>
          </div>
          <div class="grid3">
            <label>
              <span>Top N</span>
              <input id="edgeTopNInput" type="number" min="1" value="8" />
            </label>
            <label>
              <span>Top %</span>
              <input id="edgeTopPercentInput" type="number" min="1" max="100" value="25" />
            </label>
            <label>
              <span>Min</span>
              <input id="edgeThresholdInput" type="number" min="0" step="0.05" value="1" />
            </label>
          </div>
        </section>

        <section class="controlBlock">
          <span class="blockLabel">Node WINNER</span>
          <div class="segments mini" id="nodeScaleSegments">
            <button type="button" data-scale="normal" class="active">Normal</button>
            <button type="button" data-scale="log">Log</button>
          </div>
          <div class="segments mini" id="nodeSizeModeSegments">
            <button type="button" data-size-mode="relative" class="active">Relative</button>
            <button type="button" data-size-mode="absolute">Absolute</button>
          </div>
          <div class="segments" id="nodeFilterSegments">
            <button type="button" data-mode="all" class="active">All</button>
            <button type="button" data-mode="topn">Top N</button>
            <button type="button" data-mode="percent">Top %</button>
            <button type="button" data-mode="threshold">Score</button>
          </div>
          <div class="grid3">
            <label>
              <span>Top N</span>
              <input id="nodeTopNInput" type="number" min="1" value="8" />
            </label>
            <label>
              <span>Top %</span>
              <input id="nodeTopPercentInput" type="number" min="1" max="100" value="50" />
            </label>
            <label>
              <span>Min</span>
              <input id="nodeThresholdInput" type="number" min="0" step="0.05" value="1" />
            </label>
          </div>
          <div class="grid3">
            <label>
              <span>Min px</span>
              <input id="nodeMinRadiusInput" type="number" min="1" max="40" step="1" value="7" />
            </label>
            <label>
              <span>Max px</span>
              <input id="nodeMaxRadiusInput" type="number" min="2" max="80" step="1" value="28" />
            </label>
            <label>
              <span>Fold</span>
              <input id="nodeRadiusFoldInput" type="number" min="1" max="20" step="0.5" value="4" />
            </label>
          </div>
        </section>

        <section class="selectedPanel" id="selectedPanel">
          <span class="blockLabel">Selected edge</span>
          <div id="selectedDetails">None</div>
        </section>
      </aside>

      <section class="canvasWrap">
        <svg id="networkSvg" viewBox="0 0 900 620" role="img" aria-label="WIPER network"></svg>
        <div id="edgeLegend" class="edgeLegend"></div>
        <div id="sizeLegend" class="sizeLegend"></div>
        <div id="graphTooltip" class="graphTooltip" hidden></div>
      </section>

      <section class="panel tablePanel">
        <div class="tableHeader">
          <strong>Edges</strong>
          <input id="filterInput" type="search" placeholder="Filter edge" />
        </div>
        <div class="tableScroll">
          <table class="edgeTable">
            <colgroup>
              <col class="colEdge" />
              <col class="colRaw" />
              <col class="colScore" />
              <col class="colScore" />
              <col class="colPath" />
              <col class="colReason" />
            </colgroup>
            <thead>
              <tr>
                <th>Edge</th>
                <th>Raw</th>
                <th>WIPER1 UFC</th>
                <th>WIPER2 UFC</th>
                <th>Path load</th>
                <th>Reason</th>
              </tr>
            </thead>
            <tbody id="edgeRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
